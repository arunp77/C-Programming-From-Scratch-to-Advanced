site_name: C Programming — From Scratch to Advanced
site_description: A complete, beginner-friendly tutorial on the C programming language, from absolute basics to advanced topics
site_url: https://github.com/arunp77/C-Programming-From-Scratch-to-Advanced

theme:
  name: material

  # Logo (optional – remove if you don't have it yet)
  # Put file in: docs/assets/logo.png
  logo: assets/logo.png

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.expand
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: docs

nav:
  - Home: index.md

  - Getting Started:
      - Chapter 0 - Introduction to Programming and C: chapters/chapter-00.md
      - Chapter 1 - Setting Up Your Environment: chapters/chapter-01.md
      - Chapter 2 - Your First C Program: chapters/chapter-02.md

  - Language Basics:
      - Chapter 3 - Variables, Data Types and Constants: chapters/chapter-03.md
      - Chapter 4 - Operators and Expressions: chapters/chapter-04.md
      - Chapter 5 - Input and Output: chapters/chapter-05.md
      - Chapter 6 - Decision Making (if, else, switch): chapters/chapter-06.md
      - Chapter 7 - Loops and Iteration: chapters/chapter-07.md

  - Core Concepts:
      - Chapter 8 - Functions and Modular Programming: chapters/chapter-08.md
      - Chapter 9 - Arrays: chapters/chapter-09.md
      - Chapter 10 - Strings: chapters/chapter-10.md
      - Chapter 11 - Pointers - Fundamentals: chapters/chapter-11.md
      - Chapter 12 - Structures, Unions and Enums: chapters/chapter-12.md

  - Intermediate Topics:
      - Chapter 13 - Dynamic Memory Allocation: chapters/chapter-13.md
      - Chapter 14 - File Handling: chapters/chapter-14.md
      - Chapter 15 - Preprocessor Directives and Macros: chapters/chapter-15.md
      - Chapter 16 - Storage Classes, Scope and Recursion: chapters/chapter-16.md

  - Advanced Topics:
      - Chapter 17 - Advanced Pointers: chapters/chapter-17.md
      - Chapter 18 - Data Structures in C: chapters/chapter-18.md
      - Chapter 19 - Multi-File Projects and Build Systems: chapters/chapter-19.md
      - Chapter 20 - Debugging and Best Practices: chapters/chapter-20.md

  - Appendix:
      - Appendix A - C Standard Library Reference: chapters/Appendix-A.md
      - Appendix B - Cheat Sheets: chapters/Appendix-B.md
      - Appendix C - Practice Projects: chapters/Appendix-C.md

  - About: about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arunp77

    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/arunp77

copyright: "© 2026 Arun Kumar Pandey"

extra_css:
  - stylesheets/extra.css
